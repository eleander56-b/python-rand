[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "math-experiments"
version = "0.1.0"
description = "Mathematical experiments: Collatz conjecture and large numbers"
requires-python = ">=3.10"

[project.scripts]
collatz = "math_experiments.collatz:main"
googolplex = "math_experiments.googolplex:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
